        body::after { content:''; position:fixed; inset:0; background-image: linear-gradient(rgba(37,99,235,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(37,99,235,0.03) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; z-index:0; }

        /* Header & Navigation */
        header { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:rgba(4,6,10,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
        .logo { font-family:'Anton',sans-serif; font-size:26px; letter-spacing:3px; display:flex; align-items:center; gap:10px; }
        .logo-dot { width:8px; height:8px; background:var(--blue-bright); border-radius:50%; box-shadow:0 0 12px var(--blue-bright); animation:blink 2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .btn-connect { background:var(--blue); color:white; border:none; padding:10px 22px; border-radius:8px; font-family:'Syne',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; }
        .btn-connect:hover { background:#1D4ED8; transform:translateY(-1px); box-shadow:0 8px 20px rgba(37,99,235,0.4); }
        .btn-connect.ok { background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); color:var(--green); }

        /* Hero Section */
        .hero { position:relative; z-index:10; text-align:center; padding:80px 20px 60px; }
        .hero-tag { display:inline-flex; align-items:center; gap:8px; background:rgba(37,99,235,0.1); border:1px solid rgba(37,99,235,0.25); padding:6px 16px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#93C5FD; margin-bottom:28px; }
        h1 { font-family:'Anton',sans-serif; font-size:clamp(60px,10vw,120px); line-height:.9; margin-bottom:20px; }
        h1 .accent { background:linear-gradient(135deg,#3B82F6,#60A5FA); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .hero-sub { font-size:16px; color:var(--muted2); max-width:500px; margin:0 auto 40px; line-height:1.7; }

        /* Grille NFT */
        .grid-wrap { position:relative; z-index:10; padding:0 32px 80px; }
        .nft-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }

        /* Cartes Joueurs */
        .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:all .3s cubic-bezier(.34,1.56,.64,1); cursor:pointer; position:relative; padding:15px; }
        .card:hover { transform:translateY(-6px); box-shadow:0 24px 48px rgba(0,0,0,0.5); border-color:var(--blue-bright); }
        
        .rarity-pill { padding:3px 9px; border-radius:20px; font-size:9px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; display:inline-block; }
        .legend { background:var(--gold-dim); color:var(--gold); border:1px solid rgba(245,158,11,0.4); }
        .epic { background:rgba(124,58,237,0.2); color:#A78BFA; border:1px solid rgba(124,58,237,0.4); }
        .rare { background:rgba(37,99,235,0.2); color:#93C5FD; border:1px solid rgba(37,99,235,0.35); }
        .common { background:rgba(75,96,128,0.2); color:var(--muted2); border:1px solid var(--border); }

        .btn-mint { width:100%; background:var(--blue); color:white; border:none; padding:12px; border-radius:8px; font-family:'Syne',sans-serif; font-size:12px; font-weight:700; cursor:pointer; margin-top:15px; transition:0.2s; letter-spacing:0.5px; }
        .btn-mint:hover { background:#1D4ED8; }
        .btn-mint:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }

        /* Animations */
        .spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:rotate .6s linear infinite; }
        @keyframes rotate { to { transform:rotate(360deg); } }

        /* Toasts Notifications */
        .toast { position:fixed; bottom:28px; right:28px; background:var(--card); border:1px solid var(--border2); border-radius:12px; padding:14px 18px; display:flex; align-items:center; gap:12px; z-index:200; transform:translateX(140%); transition:transform .4s cubic-bezier(.34,1.56,.64,1); font-size:13px; }
        .toast.show { transform:translateX(0); }
    </style>
</head>

let wallet = null;

async function connectWallet() {
    if (!window.ethereum) return showToast('❌', 'Installe Rainbow !');
    try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        wallet = accounts[0];
        const btn = document.getElementById('connectBtn');
        btn.textContent = wallet.slice(0, 6) + "..." + wallet.slice(-4);
        btn.classList.add('ok');
        
        await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x2105' }], 
        });
        showToast('✅', 'Connecté sur Base');
    } catch (e) { console.error(e); }
}

async function runMint(playerId) {
    if (!wallet) return showToast('⚠️', 'Connecte ton wallet');
    
    const btn = document.getElementById(`btn-${playerId}`);
    btn.innerHTML = '<span class="spin"></span>';
    btn.disabled = true;

    try {
        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();
        const contract = new ethers.Contract(contractAddr, contractABI, signer);

        const tx = await contract.mint(playerId);
        showToast('⏳', 'Transaction envoyée...');
        
        await tx.wait();
        showToast('⚽', 'Joueur minté !');
        
        let minted = JSON.parse(localStorage.getItem('fb_minted') || '[]');
        minted.push(playerId);
        localStorage.setItem('fb_minted', JSON.stringify(minted));
        renderGrid();
    } catch (err) {
        console.error(err);
        if (err.message.includes("Limite de 2")) {
            showToast('🚫', 'Limite de 2/jour atteinte');
        } else {
            showToast('❌', 'Annulé');
        }
    } finally {
        btn.innerHTML = 'MINT GRATUIT';
        btn.disabled = false;
    }
}

function showToast(icon, msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function renderGrid() {
    const grid = document.getElementById('nftGrid');
    const minted = JSON.parse(localStorage.getItem('fb_minted') || '[]');
    
    grid.innerHTML = PLAYERS.map(p => {
        const isMinted = minted.includes(p.id);
        return `
            <div class="card">
                <div class="rarity-pill ${p.rarity}">${p.rarity}</div>
                <div style="font-size:40px">${p.nation}</div>
                <h3 style="margin:10px 0 5px">${p.name}</h3>
                <p style="font-size:12px; color:var(--muted2)">${p.club} · ${p.pos}</p>
                <button class="btn-mint" id="btn-${p.id}" ${isMinted ? 'disabled' : ''} onclick="runMint(${p.id})">
                    ${isMinted ? 'DÉJÀ MINTÉ' : 'MINT GRATUIT'}
                </button>
            </div>
        `;
    }).join('');
}

renderGrid();
</script>
